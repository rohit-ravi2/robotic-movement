meta:
  name: G1
  mjcf: <menagerie>/unitree_g1/scene_mjx.xml
  urdf: /tmp/g1_29dof.urdf
  total_mass: 33.341
  n_actuated: 29
  n_contact_pairs: 49
  timestep: 0.004
  units:
    angle: radian
    torque: N*m
    ang_vel: rad/s
    mass: kg
  capacity_sets:
    primary: peak
    rationale: Two capacity sets are carried. PEAK comes from the Menagerie MJX MJCF (actuatorfrcrange); CONTINUOUS comes
      from Unitree's manufacturer URDF (effort). For a ~0.25-0.4 s push-off the peak rating is the physically appropriate
      one, because continuous ratings are thermally limited and a single explosive movement is thermally free. PEAK is primary;
      CONTINUOUS is the conservative sensitivity bound. Every frontier is computed under both and the difference reported.
      Velocity limits exist only in the URDF and are shared by both sets.
    n_joints_differing: 8
  mass_deviation:
    model_kg: 33.341
    manufacturer_published_kg: 35.0
    tag: KNOWN_DEVIATION
    note: Menagerie model is ~1.7 kg lighter than Unitree's published figure, likely missing battery or covers. Affects the
      potential-energy term. GRF in body weights stays self-consistent because the model's own mass is used throughout.
  scope:
    value: full
    note: G1 carries analytic frontier and all dynamic solves.
sources:
  unitree_urdf_g1_29dof: Unitree Robotics unitree_ros, g1_29dof.urdf (manufacturer URDF; effort and velocity limits)
  menagerie_g1_mjx: MuJoCo Menagerie g1 MJCF (DeepMind-curated, derived from Unitree's published MJCF; MJX variant transferred
    to hardware in MuJoCo Playground)
