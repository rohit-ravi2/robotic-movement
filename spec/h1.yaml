meta:
  name: H1
  mjcf: <menagerie>/unitree_h1/scene.xml
  urdf: /tmp/h1.urdf
  total_mass: 51.437
  n_actuated: 19
  n_contact_pairs: 0
  timestep: 0.002
  units:
    angle: radian
    torque: N*m
    ang_vel: rad/s
    mass: kg
  capacity_sets:
    primary: peak
    rationale: Two capacity sets are carried. PEAK comes from the Menagerie MJX MJCF (actuatorfrcrange); CONTINUOUS comes
      from Unitree's manufacturer URDF (effort). For a ~0.25-0.4 s push-off the peak rating is the physically appropriate
      one, because continuous ratings are thermally limited and a single explosive movement is thermally free. PEAK is primary;
      CONTINUOUS is the conservative sensitivity bound. Every frontier is computed under both and the difference reported.
      Velocity limits exist only in the URDF and are shared by both sets.
    n_joints_differing: 0
  scope:
    value: bound_only
    tag: DECISION
    note: H1 ships zero hand-designed contact pairs (G1 MJX ships 49). Foot contact is the impulse budget for a jump, so H1
      contributes ANALYTIC FRONTIER RESULTS ONLY this run. The analytic bound needs no contact model.
  waist_note:
    value: yaw_only
    tag: STRUCTURAL
    note: H1's single torso joint is yaw. It has no waist pitch, so for a sagittal jump the trunk-recruitment DOF does not
      exist. H1 is therefore the waist-ablation embodiment rather than a matched comparison to G1.
sources:
  unitree_urdf_h1: Unitree Robotics unitree_ros, h1.urdf (manufacturer URDF; effort and velocity limits)
  menagerie_h1: MuJoCo Menagerie h1 MJCF (DeepMind-curated, derived from Unitree's published MJCF; MJX variant transferred
    to hardware in MuJoCo Playground)
